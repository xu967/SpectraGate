# SpectraGate YOLO11MM + MBSG-CM V5 改进级联融合架构
#
# 目标:
# 1. 保留原 V4 的双路骨干 + 级联融合思路
# 2. 新增更稳定的频域门控/跨谱建模实现，不影响原版模块
# 3. P5 使用轻量级两段式融合，减少低分辨率层的冗余频域建模
#
# 推荐训练参数:
#   loss_fusion_v2=true
#   fusion_spectral_weight=0.01
#   fusion_gate_weight=0.005
#   fusion_cutoff_weight=0.001

# Parameters
nc: 80

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # RGB branch
  - [-1, 1, Conv, [64, 3, 2], 'RGB']        # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 2
  - [-1, 1, Conv, [256, 3, 2]]              # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]       # 4  RGB_P3
  - [-1, 1, Conv, [512, 3, 2]]              # 5-P4/16
  - [-1, 2, C3k2, [512, True]]              # 6  RGB_P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 8
  - [-1, 1, SPPF, [1024, 5]]                # 9
  - [-1, 2, C2PSA, [1024]]                  # 10 RGB_P5

  # X branch
  - [-1, 1, Conv, [64, 3, 2], 'X']          # 11-P1/2
  - [-1, 1, Conv, [128, 3, 2]]              # 12-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]       # 13
  - [-1, 1, Conv, [256, 3, 2]]              # 14-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]       # 15 X_P3
  - [-1, 1, Conv, [512, 3, 2]]              # 16-P4/16
  - [-1, 2, C3k2, [512, True]]              # 17 X_P4
  - [-1, 1, Conv, [1024, 3, 2]]             # 18-P5/32
  - [-1, 2, C3k2, [1024, True]]             # 19
  - [-1, 1, SPPF, [1024, 5]]                # 20
  - [-1, 2, C2PSA, [1024]]                  # 21 X_P5

  # P3/P4: full cascade
  - [[4, 15], 1, LFEM_D_V5, []]             # 22
  - [22, 1, NLFEM_D_V5, []]                 # 23
  - [23, 1, FDFTM_V6, []]                   # 24 Fused_P3

  - [[6, 17], 1, LFEM_D_V5, []]             # 25
  - [25, 1, NLFEM_D_V5, []]                 # 26
  - [26, 1, FDFTM_V6, []]                   # 27 Fused_P4

  # P5: lighter cascade
  - [[10, 21], 1, LFEM_D_V5, []]            # 28
  - [28, 1, FDFTM_V6, []]                   # 29 Fused_P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 30
  - [[-1, 27], 1, Concat, [1]]                  # 31
  - [-1, 2, C3k2, [512, False]]                 # 32

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 33
  - [[-1, 24], 1, Concat, [1]]                  # 34
  - [-1, 2, C3k2, [256, False]]                 # 35 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]                  # 36
  - [[-1, 32], 1, Concat, [1]]                  # 37
  - [-1, 2, C3k2, [512, False]]                 # 38 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]                  # 39
  - [[-1, 29], 1, Concat, [1]]                  # 40
  - [-1, 2, C3k2, [1024, True]]                 # 41 (P5/32)

  - [[35, 38, 41], 1, Detect, [nc]]             # 42
